# Serves the built SPA and reverse-proxies the API to the backend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;   # ticket report PDF uploads

    # SPA routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> backend container (service name "api" on the compose network).
    # The original /api/v1/... path is preserved and matches the FastAPI routes.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming support for the AI assistant SSE endpoint (used once AI is enabled).
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Remote MCP server (streamable HTTP) -> backend /mcp. Token-guarded in the app.
    # Reachable at <site>/mcp (behind the outer proxy: e.g. briteai.in/service/mcp).
    location /mcp {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;             # MCP streams responses
        proxy_read_timeout 300s;
    }
}
